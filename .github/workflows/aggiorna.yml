name: Aggiorna prezzi e pubblica

on:
  schedule:
    - cron: "0 7 * * *"    
    - cron: "0 13 * * *"   
  push:
    branches: [main]       
  workflow_dispatch:       

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v6

      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Esegue gli script di aggiornamento
        run: |
          python gas-checking-app-main/scripts/prepara_dati.py
          python gas-checking-app-main/scripts/aggiorna_tariffe.py

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v6

      - name: Carica la cartella web
        uses: actions/upload-pages-artifact@v5
        with:
          path: gas-checking-app-main/web

      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v5
